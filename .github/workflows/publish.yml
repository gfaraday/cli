# This is a basic workflow to help you get started with Actions

name: Publisher

on:
  push:
    branches: [ master ]

  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check_version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      git_tag_name: ${{ steps.tag_check.outputs.git_tag_name }}
    steps:
      - uses: actions/checkout@v2 # https://github.com/actions/checkout
      
      - uses: CumulusDS/get-yaml-paths-action@v0.1.0
        id: get_package_version
        with:
          file: pubspec.yaml
          version: version
      # debug
      - name: Output package version
        run: echo 'version:' ${{ steps.get_package_version.outputs.version }}

      - uses: dudo/tag_check@v1.0.2
        id: tag_check
        with:
          version: ${{ steps.get_package_version.outputs.version }}
          git_tag_prefix: v

  push_tag:
    name: Push Tag
    needs: check_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2 # https://github.com/actions/checkout
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.26.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_TAG: ${{ needs.check_version.outputs.git_tag_name }}

  publish_pub:
    name: Publish new Pub version
    needs: check_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Write version
        uses: DamianReeves/write-file-action@v1.0
        with:
          path: lib/src/utils/version.g.dart
          contents: String version = "${{ needs.check_version.outputs.git_tag_name }}";
      # sakebook/actions-flutter-pub-publisher 已无人维护，其依赖的裸 `pub`
      # 命令在 Dart 3 中已移除，这里改用官方 setup-dart 手动发布
      - uses: dart-lang/setup-dart@v1
      - name: Write pub credentials
        run: |
          mkdir -p "$HOME/.config/dart"
          echo '${{ secrets.PUB_PUBLISHER_CREDENTIAL_JSON }}' > "$HOME/.config/dart/pub-credentials.json"
      - name: Publish to pub.dev
        run: |
          dart pub get
          dart pub publish --force
